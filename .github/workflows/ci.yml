name: CI

# Manual-only, deliberately. On a private repository that bills every
# minute of it, running on every push and every pull request is not worth
# it for a project with one developer who runs `make lint && make test &&
# make e2e` locally before committing anyway.
#
# Nothing here is deleted, so the checks are still the source of truth for
# what "green" means. To run one, use the Actions tab -> CI -> Run
# workflow. To go back to running automatically, add push/pull_request
# trigger lines below.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"

jobs:
  test:
    name: fmt, vet, build, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt check
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to be run on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # internal/audio has real ffmpeg/ffprobe tests (skipped via
      # exec.LookPath when the tool is missing) that prove its argument
      # handling against the actual CLIs, not just against its own stub
      # scripts. internal/transcriber/whispercpp has no equivalent: every
      # one of its tests drives a stub script, never a real whisper-cli
      # binary, so nothing here needs to install one.
      - name: Install ffmpeg
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      # internal/postgres and internal/e2e dial a real Postgres via
      # testcontainers-go; GitHub's ubuntu-24.04 runners ship a working
      # Docker daemon, but confirm it rather than let a missing daemon
      # surface as an opaque testcontainers error deep in `go test`.
      # First use of postgres:17-alpine pulls the image (~20s); it is not
      # pre-cached on the runner and there is no shared cache across jobs.
      - name: Confirm Docker daemon (needed by internal/postgres, internal/e2e)
        run: |
          docker version
          docker info

      - name: go test -race
        run: go test ./... -race -count=1 -v

  docker:
    name: docker build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build helios-transcription-api image
        run: docker build -f deploy/Dockerfile -t helios-transcription-api:ci .
